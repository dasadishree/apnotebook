<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adishree's ap study notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
<div class="shell">

    <div class="sidebar">
        <div class="logo-block">
            <div class="logo-eyebrow">study notebook</div>
            <div class="logo-title">adishree's ap study notebook</div>
        </div>
        <div class="nav-label">classes</div>
        <div class="class-list" id="classList"></div>
        <div class="sidebar-footer">
            you've got this ✦<br>
            manifesting good scores
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <div class="breadcrumb" id="breadcrumb">
                <span class="bc-class" id="bc-class">select a class</span>
            </div>
            <div class="topbar-actions">
                <button class="mode-btn" id="pageToggle" type="button">page: notes</button>
                <div class="search-wrap">
                    <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="search" id="searchInput" placeholder="search notes… (Enter)" autocomplete="off" title="Press Enter to jump to the first matching unit">
                </div>
            </div>
        </div>

        <div class="content-row">
            <div class="unit-sidebar panel" id="unitSidebar">
                <div class="unit-label">units</div>
                <div id="unitList"></div>
            </div>

            <div class="notes-body panel panel-main" id="notesBody">
                <div class="empty-state">
                    <div class="empty-glyph">✦</div>
                    welcome to the notebook
                    <span class="empty-subtext">pick a class on the left to get started</span>
                </div>
            </div>

            <div class="outline panel" id="outline">
                <div class="outline-label">on this page</div>
                <div id="outlineList"></div>
            </div>
        </div>
    </div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
